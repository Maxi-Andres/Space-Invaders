# DOSBox 0.74 configuration for the game.
# run.bat starts DOSBox with the repo folder as the working directory,
# so "mount c ." mounts the repo as drive C:.

[sdl]
fullscreen=false
fulldouble=false
fullresolution=0x0
windowresolution=1024x768
output=overlay
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
usescancodes=true

[dosbox]
machine=svga_s3
captures=capture
memsize=32

[render]
frameskip=0
aspect=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100
disney=true

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[autoexec]
@echo off
mount c .
c:
set PATH=Z:\;C:\TOOLS\TASM
rem If the keyboard layout is wrong, change "auto" above or type: keyb sp
cls
game
